<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #090909;
        color: #f4efe1;
        font-family: Arial, Helvetica, sans-serif;
        background-image:
          radial-gradient(circle at top, rgba(212, 175, 55, 0.08), transparent 35%),
          linear-gradient(180deg, #0b0b0b 0%, #090909 45%, #050505 100%);
      }

      main {
        max-width: 40rem;
        margin: 1.5rem;
        padding: 2rem;
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.03);
      }

      p {
        line-height: 1.7;
        color: #b4ab98;
      }
    </style>
  </head>
  <body>
    <main>
      <p style="letter-spacing: 0.3em; text-transform: uppercase; color: #d4af37">Garden</p>
      <h1 style="margin-top: 0">The Garden shell is ready.</h1>
      <p>
        You&apos;re offline, so Garden is showing its cached shell. Reconnect to
        load live submissions, claim reservations, and fresh treasury data.
      </p>
    </main>
  </body>
</html>
